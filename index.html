<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Financial Filing RAG Assistant</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161920;
      --surface: #1f232d;
      --border: #2c313c;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #4f8cff;
      --accent-soft: #2f4a7a;
      --ok: #3ddc97;
      --warn: #ffd166;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      row-gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-pill.idle { background: #1f232d; color: var(--muted); }
    .status-pill.indexing { background: #2b2d3b; color: var(--warn); }
    .status-pill.done { background: #111722; color: var(--ok); }

    .ticker-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ticker-row input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }

    .ticker-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .ticker-row button {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .ticker-row button:hover { background: #3d5fa8; }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 320px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 6px 4px;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 86%;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .msg p { margin: 0 0 8px; line-height: 1.55; white-space: pre-wrap; }

    /* Markdown-rendered assistant answers */
    .msg .md { line-height: 1.6; font-size: 14px; }
    .msg .md p { margin: 0 0 10px; white-space: normal; }
    .msg .md p:last-child { margin-bottom: 0; }
    .msg .md ul { margin: 0 0 10px; padding-left: 22px; }
    .msg .md li { margin: 4px 0; line-height: 1.55; }
    .msg .md strong { color: #fff; font-weight: 700; }
    .msg .md em { color: #cfd6e4; }
    .msg .md code {
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12.5px;
    }
    .msg .md h1, .msg .md h2, .msg .md h3,
    .msg .md h4, .msg .md h5, .msg .md h6 {
      margin: 4px 0 8px;
      line-height: 1.3;
    }
    .msg .md h1 { font-size: 18px; }
    .msg .md h2 { font-size: 16px; }
    .msg .md h3 { font-size: 15px; }
    .msg .md h4, .msg .md h5, .msg .md h6 { font-size: 14px; }

    .sources {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .source-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .source-card h4 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
    .source-card p { margin: 0; font-size: 12px; color: var(--muted); }
    .source-card .snippet {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text);
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .form input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }

    .form input:focus { outline: none; border-color: var(--accent); }

    .form button {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .form button:hover { background: #3d5fa8; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--muted);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
      font-size: 14px;
    }

    .error {
      background: #2b1418;
      border: 1px solid var(--danger);
      color: #ff9a9a;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
    }

    footer {
      padding: 14px 24px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      main { padding: 14px; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Financial Filing RAG Assistant</h1>
    <p>Ask about SEC filings and get answers grounded in the filing text.</p>
  </header>

  <main>
    <div class="status-pill idle" id="statusPill">⏳ Status: idle</div>

    <div class="ticker-row">
      <input id="tickerInput" placeholder="Company ticker (e.g. AAPL)" />
      <button id="loadTickerBtn">Load / Index</button>
    </div>

    <div class="chat" id="chat">
      <div class="empty-state">Ask a question once a company index is loaded.</div>
    </div>

    <div class="form">
      <input id="questionInput" placeholder="Ask a question about the filing..." />
      <button id="askBtn">Ask</button>
    </div>
  </main>

  <footer>
    Answers are generated only from the indexed SEC filing context.
  </footer>

  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
